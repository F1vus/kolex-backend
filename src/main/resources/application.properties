# ============================================
# DATABASE CONFIGURATION
# ============================================
spring.datasource.url=jdbc:postgresql://localhost:5433/kolexdb
spring.datasource.username=admin
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
# ============================================
# FLYWAY CONFIGURATION
# ============================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.table=flyway_schema_history

# ============================================
# SERVER CONFIGURATION
# ============================================
server.port=8080
spring.application.name=kolex-backend

# ============================================
# JWT CONFIGURATION
# ============================================
jwt.secret=U29tZVJhbmRvbVdvcmRzRm9ySnd0S2V5QW5kRm9yTXlQcm9qZWN0VG9kYXlJc1NhdHVyZGF5U3VuSXNTb0JyaWdodERhdGUyMDI1MTEwMUNhYmJhZ2VPcmFuZ2U
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# ============================================
# LOGGING CONFIGURATION
# ============================================
logging.level.root=INFO
logging.level.net.kolexbackend=DEBUG
logging.level.org.springframework.security=DEBUG

# ============================================
# SWAGGER / OPENAPI CONFIGURATION
# ============================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.enabled=true

kolex-urls=http://localhost:3000,http://10.0.2.2:*
